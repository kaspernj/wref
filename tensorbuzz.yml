rvm: true
builds:
  build_1:
    environment:
      RUBY_VERSION: 2.7.7
    name: Ruby 2.7.7
    paths:
      - "**/*"
      - "!*.md"
      - "!LICENSE.txt"
      - "!.document"
      - "!.gitignore"
      - "!.github/**"
      - "!.rubocop.yml"
      - "!.rubocop_todo.yml"
    script:
      - bundle exec rspec
  build_2:
